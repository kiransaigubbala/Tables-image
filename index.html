<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
  </head>
  <body style="background-color: #FFF2DB;">
    <h1 align="center" style="background-color: #541A1A; color: #EAECF0;">Image Gallery Using Tables and Nested Tables</h1>
    <table  style="border: 2px solid black;" align="center" cellspacing="0" cellpadding="0"> 
      <tr>
        <th style="background-color: #0A2947; color: #FE7F2D;">Lion</th>
        <th style="background-color: #0A2947; color: #FE7F2D;">Tiger</th>
        </tr>
        <tr>

        <td border="2"><img src="lion.jpg" alt="Lion" width="100" height="100" /></td>

        <td border="2"><img src="tiger.jpg" alt="Tiger" width="100" height="100" /></td>
      </tr>
      <tr>
        <th style="background-color: #0A2947; color: #FE7F2D;">cheetah</th>
        <th style="background-color: #0A2947; color: #FE7F2D;">Elephant</th>
      </tr>
      <tr>
        <td><img src="cheetah.jpg" alt="Cheetah" width="100" height="100" /></td>
        <td><img src="elephant.jpeg" alt="Elephant" width="100" height="100" /></td>
      </tr>
      <tr>
        <th style="background-color: #0A2947; color: #FE7F2D;">python</th>
        <th style="background-color: #0A2947; color: #FE7F2D;">cobra</th>
      </tr>
      <tr>
        <td><img src="python.jpeg" alt="Python" width="100" height="100" /></td>
        <td><img src="cobra.jpeg" alt="Cobra" width="100" height="100" /></td>
      </tr>
      <tr>
        <th style="background-color: #0A2947; color: #FE7F2D;">blue whale</th>
        <th style="background-color: #0A2947; color: #FE7F2D;">dolphin</th>
      </tr>
      <tr>
        <td><img src="blue whale.jpeg" alt="Blue Whale" width="100" height="100" /></td>
        <td><img src="dolphin.jpeg" alt="Dolphin" width="100" height="100" /></td>
        
      </tr>
    </table>
  </body>
</html>
